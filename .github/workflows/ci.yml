name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .agents/plugins/plugins/grok-imagine/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .agents/plugins/plugins/grok-imagine/server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
