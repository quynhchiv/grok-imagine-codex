name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run audit:bundle
      - run: node scripts/mcp-smoke.mjs

  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m json.tool .agents/plugins/marketplace.json > /dev/null
      - run: python -m json.tool .claude-plugin/plugin.json > /dev/null
      - run: python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - run: python -m json.tool .codex-plugin/plugin.json > /dev/null
      - run: python -m json.tool .mcp.json > /dev/null
      - run: python -m json.tool plugin.json > /dev/null
      - run: python -m json.tool mcp.json > /dev/null
      - run: node server/scripts/validate-package.mjs
